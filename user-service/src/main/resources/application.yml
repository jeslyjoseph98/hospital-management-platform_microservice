server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hms_user?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

hms:
  admin-registration-code: ${HMS_ADMIN_REGISTRATION_CODE:HMS-ADMIN-2026}
  pharmacy-registration-code: ${HMS_PHARMACY_REGISTRATION_CODE:HMS-PHARM-2026}
  jwt:
    secret: ${HMS_JWT_SECRET:dev-only-change-me-dev-only-change-me}
    expiry-minutes: ${HMS_JWT_EXPIRY_MINUTES:60}
  services:
    doctor-url: ${HMS_SERVICES_DOCTOR_URL:http://localhost:8082}

logging:
  level:
    com.hms.userservice: INFO
